<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d">
<title id="t">Hardik Gaonkar</title>
<desc id="d">AI and ML engineer in Bengaluru building AI systems that prove they work. AegisOps pass rate 76% to 100%, CareFlow AI Recall@1 0.955, GroundTruth faithfulness 0.94 to 0.97, 1,228 automated tests.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.name{font-size:64px;font-weight:800;letter-spacing:-2.5px;fill:#0b1020}
.tag{font-size:22px;font-weight:600;fill:#0b1020}
.meta{font-size:15px;fill:#4a5470}
.k{font-size:13px;font-weight:600;fill:#4a5470}
.v{font-size:26px;font-weight:800;letter-spacing:-.8px;fill:#0b1020}
.n{font-size:12px;fill:#6b7390}
.a{animation:in .8s cubic-bezier(.16,1,.3,1) backwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.a{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7fb"/><stop offset="1" stop-color="#e6ebf8"/></linearGradient>
<radialGradient id="g1" cx=".82" cy=".1" r=".55"><stop offset="0" stop-color="#5cf2d6" stop-opacity="0.35"/><stop offset="1" stop-color="#5cf2d6" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".6" cy=".55" r=".5"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.3"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
<radialGradient id="g3" cx=".98" cy=".95" r=".45"><stop offset="0" stop-color="#9a7bff" stop-opacity="0.28"/><stop offset="1" stop-color="#9a7bff" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="1000" height="360" rx="22"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1000" height="360" fill="url(#bg)"/><rect width="1000" height="360" fill="url(#g1)"/><rect width="1000" height="360" fill="url(#g2)"/><rect width="1000" height="360" fill="url(#g3)"/>
<g class="a"><text x="48" y="96" class="name">Hardik Gaonkar</text></g>
<g class="a" style="animation-delay:.12s"><text x="50" y="140" class="tag">I build AI systems that prove they work.</text>
<text x="50" y="172" class="meta">AI &amp; ML engineer in Bengaluru. Autonomous agents, RAG, ML and computer vision,</text>
<text x="50" y="194" class="meta">each shipped with held-out benchmarks, confidence intervals and CI gates.</text></g>
<g class="a" style="animation-delay:.25s"><g transform="translate(48 242)"><rect width="213" height="86" rx="14" fill="rgba(255,255,255,0.75)" stroke="rgba(11,16,32,0.12)"/>
<text x="16" y="26" class="k">AegisOps</text><text x="16" y="58" class="v">76% → 100%</text><text x="16" y="76" class="n">pass rate, 21 live failures</text></g><g transform="translate(277 242)"><rect width="213" height="86" rx="14" fill="rgba(255,255,255,0.75)" stroke="rgba(11,16,32,0.12)"/>
<text x="16" y="26" class="k">CareFlow AI</text><text x="16" y="58" class="v">0.955</text><text x="16" y="76" class="n">Recall@1, hybrid RAG</text></g><g transform="translate(506 242)"><rect width="213" height="86" rx="14" fill="rgba(255,255,255,0.75)" stroke="rgba(11,16,32,0.12)"/>
<text x="16" y="26" class="k">GroundTruth</text><text x="16" y="58" class="v">0.94–0.97</text><text x="16" y="76" class="n">faithfulness</text></g><g transform="translate(735 242)"><rect width="213" height="86" rx="14" fill="rgba(255,255,255,0.75)" stroke="rgba(11,16,32,0.12)"/>
<text x="16" y="26" class="k">Tests</text><text x="16" y="58" class="v">1,228</text><text x="16" y="76" class="n">across four systems</text></g></g>
</g>
<rect x=".5" y=".5" width="999" height="359" rx="22" fill="none" stroke="rgba(11,16,32,0.12)"/>
</svg>